  <text x="72" y="96" font-family="'SF Mono','Menlo','Consolas','Liberation Mono',monospace" font-size="13" letter-spacing="2.4" fill="#8b949e">AI ENGINEER  /  R&amp;D  /  BIZLINK GROUP  /  TAIWAN</text>

  <text x="72" y="168" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="-1.5" fill="#f0f6fc">Rahul Selvaraj</text>

  <text x="72" y="214" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#9198a1">Applied AI, multi-agent systems and edge IoT.</text>

  <line x1="930" y1="62" x2="930" y2="218" stroke="#30363d"/>
  <text x="962" y="128" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="64" font-weight="700" fill="url(#accent)">02</text>
  <text x="964" y="160" font-family="'SF Mono','Menlo','Consolas','Liberation Mono',monospace" font-size="12" letter-spacing="2.4" fill="#8b949e">PATENTS HELD</text>
