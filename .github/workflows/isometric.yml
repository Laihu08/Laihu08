name: Isometric contribution calendar

on:
  schedule:
    - cron: "17 16 * * *"   # daily, 00:17 Taiwan time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/isometric.py"
      - ".github/workflows/isometric.yml"
      - "docs/index.html"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw calendar
        run: python .github/scripts/isometric.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add assets/isometric-*.svg docs/contributions.json
          git diff --cached --quiet || git commit -m "Update isometric contribution calendar"
          git push
